
name: Deploy Timberpark to Hostinger

on:
  push:
    branches:
      - master

  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build and Deploy Website
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Build the static Next.js website
      - name: Build website
        run: npm run build

      # 5. Verify static output
      - name: Verify build output
        run: test -f out/index.html

      # 6. Preview FTP deployment
      - name: FTP deployment dry run
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./out/
          server-dir: ./
          dry-run: true
